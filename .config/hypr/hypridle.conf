# ─────────────────────────────────────────────────────────────────────
#  「✦ HYPRIDLE CONFIG ✦ 」
# ─────────────────────────────────────────────────────────────────────

# ── GENERAL ──────────────────────────────────────────────────────────
general {
  # The one lock path, shared with the keybinds — guarded against stacking a
  # second hyprlock, closes any focused quickshell panel first, and keeps
  # hyprlock's output in ~/.cache/hyprlock.log.
  lock_cmd = /home/adi/.config/hypr/scripts/lock.sh

  # hypridle holds a delay inhibitor while this runs, so the trailing sleep is
  # what keeps the machine awake long enough for hyprlock to map its surface.
  # Without it the display can go down before the lock is actually on it.
  before_sleep_cmd = loginctl lock-session && sleep 1

  after_sleep_cmd = hyprctl dispatch dpms on
}

# ── IDLE LISTENERS ───────────────────────────────────────────────────
# LOCK AFTER 5 MINUTES
listener {
  timeout = 300
  on-timeout = loginctl lock-session
}

# TURN OFF DISPLAY AFTER 10 MINUTES
listener {
  timeout = 600
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# SUSPEND AFTER 30 MINUTES
listener {
  timeout = 1800
  on-timeout = systemctl suspend
}
